services:
  openduet:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      OPENDUET_TOKEN: ${OPENDUET_TOKEN:?Set a random OPENDUET_TOKEN of at least 24 characters}
      # Add only the provider/connector credentials you intend this service to use.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./openduet.docker.toml:/app/openduet.toml:ro
      - openduet-data:/data
    init: true
volumes:
  openduet-data:
