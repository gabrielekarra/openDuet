#cloud-config
# Ubuntu 24.04+, public SSH key configured through your VPS provider.
# The console binds loopback; access it through SSH or your own HTTPS reverse proxy.
package_update: true
packages: [docker.io, docker-buildx, docker-compose-v2, git, openssl]
write_files:
  - path: /etc/systemd/system/openduet.service
    permissions: '0644'
    content: |
      [Unit]
      Description=OpenDuet always-on workspace
      Requires=docker.service
      PartOf=docker.service
      After=docker.service network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/openduet
      Environment=COMPOSE_PARALLEL_LIMIT=1
      ExecStart=/usr/bin/docker compose up -d --build
      ExecStop=/usr/bin/docker compose stop
      TimeoutStartSec=1800
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [git, clone, https://github.com/gabrielekarra/openDuet.git, /opt/openduet]
  - [sh, -c, 'umask 077; cd /opt/openduet; printf "OPENDUET_TOKEN=%s\nOPENDUET_COMPUTER_TOKEN=%s\n" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env']
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, openduet.service]
