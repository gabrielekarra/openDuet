[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openduet"
version = "0.2.0"
description = "An open source, self-hosted proactive assistant for local and remote language models"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "jsonschema>=4.23,<5", "mcp>=1.26,<2",
  "websockets>=14,<17",
  "cryptography>=44,<51", "numpy>=2,<3", "PyYAML>=6,<7", "pypdf>=5,<7", "Pillow>=11,<14",
  "reportlab>=4,<5",
  "openpyxl>=3.1,<4", "python-pptx>=1.0,<2", "python-docx>=1.1,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
voice = ["faster-whisper>=1.1,<2"]
kev = ["torch>=2.8,<3", "transformers>=5,<6", "peft>=0.18,<1"]
mlx = ["mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'", "torch>=2.8,<3", "transformers>=5,<6"]
mac = ["pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'", "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
openduet = "openduet.__main__:main"
openduet-kev = "openduet.kev.service:main"

[tool.hatch.build.targets.wheel]
packages = ["openduet"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["openduet/kev/vendor"]

