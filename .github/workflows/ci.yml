name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    name: Portable workspace and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: uv sync --locked --extra dev --extra browser
      - name: Runtime, adapters and deterministic policy
        run: |
          uv run --no-sync pytest tests/runtime -q
          uv run --no-sync ruff check --select E4,E7,E9,F,I,UP openduet tests/runtime
          uv run --no-sync openduet-kev-eval --output docs/benchmarks/kev-fixture
      - name: Console and Telegram acceptance
        env:
          OPENDUET_TOKEN: ci-preview-only-token-not-a-real-credential
          OPENDUET_PREVIEW_DATA: /tmp/openduet-ci-preview
        run: |
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync uvicorn tests.fixtures.openduet_preview:app --host 127.0.0.1 --port 8766 --no-access-log > /tmp/openduet-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=1)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Preview server did not start')
          PY
          uv run --no-sync python tests/runtime/browser_smoke.py
          uv run --no-sync python tests/runtime/prototype_smoke.py
          npm install --prefix "$RUNNER_TEMP/lighthouse" --no-audit --no-fund lighthouse@13.5.0
          export LIGHTHOUSE_BIN="$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse"
          export CHROME_PATH="$(uv run --no-sync python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --no-sync python scripts/check_accessibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-evidence
          path: |
            .runtime/screenshots
            docs/benchmarks/kev-fixture.*
  mac:
    name: Portable Mac bridge imports and contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra mac
      - run: uv run --no-sync python -c 'import AppKit, ApplicationServices, Quartz'
      - run: uv run --no-sync pytest tests/runtime/test_delivery_and_make.py tests/runtime/test_product.py tests/runtime/test_kev_contracts.py tests/runtime/test_onboarding.py -q
      - run: uv run --no-sync python scripts/check_installation.py
  office:
    name: Native Office recalculation and previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc libreoffice-impress poppler-utils
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python scripts/check_office.py
  specialist:
    name: Specialist research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: specialist
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q

  computer:
    name: Isolated Docker computer and hostile-page fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker build --build-arg OPENDUET_BROWSER=true -t openduet:test .
      - run: python scripts/check_computer.py
