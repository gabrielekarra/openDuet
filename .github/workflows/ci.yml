name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: OpenDuet workspace (Python + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install portable workspace
        run: uv sync --locked --extra dev --extra browser
      - name: Runtime regressions and lint
        run: |
          uv run --no-sync pytest tests/runtime -q
          uv run --no-sync ruff check --select E4,E7,E9,F,I,UP openduet tests/runtime
      - name: Browser smoke with disposable local fixture
        env:
          OPENDUET_TOKEN: ci-preview-only-token-not-a-real-credential
          OPENDUET_PREVIEW_DATA: /tmp/openduet-ci-preview
        run: |
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync uvicorn tests.fixtures.openduet_preview:app --host 127.0.0.1 --port 8766 --no-access-log > /tmp/openduet-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8766', timeout=1)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Preview server did not start')
          PY
          uv run --no-sync python tests/runtime/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openduet-workspace-screenshots
          path: .runtime/screenshots
          if-no-files-found: ignore

  daemon:
    name: bobbd (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync
        working-directory: bobbd
        run: |
          uv sync --frozen
          # Linux has no Metal; the CPU build of MLX lets the model-free suite import.
          uv pip install "mlx[cpu]==$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("mlx"))')"
      - name: Test
        working-directory: bobbd
        run: uv run --no-sync pytest -q -m "not slow"

  specialist:
    name: specialist (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        working-directory: specialist
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q

  core-linux:
    name: BobbCore (Swift, Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: BobbApp
        run: |
          apt-get update -qq && apt-get install -y -qq libsqlite3-dev sqlite3 > /dev/null
          swift test -j 1

  license-tools:
    name: License tools (Python + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: tools/license
        run: |
          uv sync
          uv run pytest -q
      - name: Test fulfillment worker
        working-directory: tools/license/worker
        run: npm test

  app:
    name: BobbApp (Swift, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          swift --version
      - name: Build
        working-directory: BobbApp
        run: |
          set -o pipefail
          swift build -Xswiftc -continue-building-after-errors 2>&1 | tee build.log || {
            echo "::group::errors"; grep -E "error:" build.log | sort -u | head -150; echo "::endgroup::"; exit 1; }
      - name: Test
        working-directory: BobbApp
        run: swift test -j 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native integration fixtures
        working-directory: BobbApp
        run: BOBB_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" .build/debug/BobbApp --check-integrations "$GITHUB_WORKSPACE/tests/fixtures/mcp_http_server.py"

  package:
    name: OpenDuet.dmg (bundle, daemon smoke test, DMG)
    runs-on: macos-latest
    needs: [app, daemon]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
      - name: Package (ad-hoc signed)
        run: scripts/package.sh
      - name: Render screenshots of the real views
        run: |
          dist/OpenDuet.app/Contents/MacOS/BobbApp --render-docs dist/screenshots || true
          ls -la dist/screenshots || true
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDuet-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshots
          if-no-files-found: ignore
          retention-days: 14
