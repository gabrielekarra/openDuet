name: Real Kev benchmark
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dtype:
        description: Torch inference dtype (results are recorded separately)
        type: choice
        options: [bfloat16, float32, int8]
        default: bfloat16
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: torch, runner: ubuntu-latest, extra: kev}
          - {backend: mlx, runner: macos-15, extra: mlx}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      OPENDUET_KEV_BACKEND: ${{ matrix.backend }}
      OPENDUET_KEV_DEVICE: cpu
      OPENDUET_KEV_DTYPE: ${{ inputs.dtype || 'bfloat16' }}
      OPENDUET_KEV_MODELS: ${{ github.workspace }}/.runtime/kev-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra "${{ matrix.extra }}"
      - name: CPU backend numerical contracts
        if: matrix.backend == 'torch'
        run: |
          uv run --no-sync python -c 'import os,platform,torch; print(platform.processor(),os.cpu_count(),torch.get_num_threads()); print("BF16 acceleration:",getattr(torch.cpu,"_is_avx512_bf16_supported",lambda:False)())'
          uv run --no-sync --with pytest python -m pytest tests/runtime/test_cpu_quantization.py -q
      - name: Download verified weights
        run: uv run --no-sync python -c 'import asyncio,os; from openduet.kev.models import download; asyncio.run(download(os.environ["OPENDUET_KEV_BACKEND"]))'
      - name: Real model evaluation
        run: |
          set --
          baseline="docs/benchmarks/kev-${OPENDUET_KEV_BACKEND}-${OPENDUET_KEV_DTYPE}-baseline.json"
          if [ -f "$baseline" ]; then set -- --baseline "$baseline"; fi
          uv run --no-sync openduet-kev-eval --backend "$OPENDUET_KEV_BACKEND" --output "docs/benchmarks/kev-$OPENDUET_KEV_BACKEND" "$@"
      - name: Frozen additional EN/IT acceptance cases
        run: uv run --no-sync openduet-kev-eval --backend "$OPENDUET_KEV_BACKEND" --cases openduet/kev/acceptance-cases.json --output "docs/benchmarks/kev-$OPENDUET_KEV_BACKEND-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kev-${{ matrix.backend }}-${{ github.run_id }}
          path: |
            docs/benchmarks/kev-${{ matrix.backend }}.json
            docs/benchmarks/kev-${{ matrix.backend }}.md
            docs/benchmarks/kev-${{ matrix.backend }}-acceptance.json
            docs/benchmarks/kev-${{ matrix.backend }}-acceptance.md
  parity:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: kev-*-${{ github.run_id }}
          path: .runtime/parity
          merge-multiple: true
      - name: Require actual MLX and Torch readout parity
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from openduet.kev.eval import compare
          root=Path('.runtime/parity')
          result={suffix or 'seed':compare(json.loads((root/('kev-torch'+suffix+'.json')).read_text()),json.loads((root/('kev-mlx'+suffix+'.json')).read_text())) for suffix in ['', '-acceptance']}
          result['passed']=all(item['passed'] for item in result.values())
          (root/'parity.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          if not result['passed']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kev-parity-${{ github.run_id }}
          path: .runtime/parity/parity.json
