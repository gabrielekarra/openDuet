name: Real Kev benchmark
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dtype:
        description: Torch inference dtype (results are recorded separately)
        type: choice
        options: [bfloat16, float32]
        default: bfloat16
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: torch, runner: ubuntu-latest, extra: kev}
          - {backend: mlx, runner: macos-15, extra: mlx}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      OPENDUET_KEV_BACKEND: ${{ matrix.backend }}
      OPENDUET_KEV_DEVICE: cpu
      OPENDUET_KEV_DTYPE: ${{ inputs.dtype || 'bfloat16' }}
      OPENDUET_KEV_MODELS: ${{ github.workspace }}/.runtime/kev-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra "${{ matrix.extra }}"
      - name: Explicit verified download and model evaluation
        run: |
          set --
          baseline="docs/benchmarks/kev-${OPENDUET_KEV_BACKEND}-${OPENDUET_KEV_DTYPE}-baseline.json"
          if [ -f "$baseline" ]; then set -- --baseline "$baseline"; fi
          uv run --no-sync openduet-kev-eval --backend "$OPENDUET_KEV_BACKEND" --download --output "docs/benchmarks/kev-$OPENDUET_KEV_BACKEND" "$@"
      - name: Frozen additional EN/IT acceptance cases
        run: uv run --no-sync openduet-kev-eval --backend "$OPENDUET_KEV_BACKEND" --cases openduet/kev/acceptance-cases.json --output "docs/benchmarks/kev-$OPENDUET_KEV_BACKEND-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kev-${{ matrix.backend }}-${{ github.run_id }}
          path: docs/benchmarks/kev-${{ matrix.backend }}*
  parity:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: kev-*-${{ github.run_id }}
          path: .runtime/parity
          merge-multiple: true
      - name: Require actual MLX and Torch readout parity
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from openduet.kev.eval import compare
          root=Path('.runtime/parity')
          result=compare(json.loads((root/'kev-torch.json').read_text()),json.loads((root/'kev-mlx.json').read_text()))
          (root/'parity.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          if not result['passed']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kev-parity-${{ github.run_id }}
          path: .runtime/parity/parity.json
