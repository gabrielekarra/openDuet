<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed"><meta name="description" content="OpenDuet — your own proactive assistant, on Telegram.">
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml"><link rel="icon" href="/brand/favicon.png" sizes="32x32"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css"><title>OpenDuet</title>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content / Vai al contenuto</a>
  <section id="login" hidden><div class="login-card"><div id="login-mark"></div><h1>OpenDuet</h1><p>Your work. Your models.<br>Il tuo lavoro. I tuoi modelli.</p><form id="login-form"><label for="token">Workspace access token / Token di accesso</label><input id="token" type="password" required autocomplete="current-password"><button>Sign in / Accedi</button></form></div></section>
  <div id="workspace" hidden><aside class="rail"><a class="brand" href="/" aria-label="OpenDuet"><span id="brand-mark"></span><b>OpenDuet</b></a><nav id="navigation" aria-label="Main navigation / Navigazione principale"></nav><div class="rail-note">Open source<br>Self-hosted</div></aside><main><header class="mobile-brand"><span id="mobile-mark"></span><b>OpenDuet</b></header><div id="content" tabindex="-1"></div></main></div>
  <dialog id="review-editor"><form id="review-form"><h2>Edit exact action / Modifica l’azione esatta</h2><label for="review-payload">Payload JSON</label><textarea id="review-payload" rows="14" required></textarea><div class="actions"><button type="submit">Save a new preview / Salva una nuova anteprima</button><button type="button" data-close="review-editor" class="secondary">Cancel / Annulla</button></div></form></dialog>
  <dialog id="more-navigation"><h2>More / Altro</h2><nav id="more-links" aria-label="More views / Altre viste"></nav><button data-close="more-navigation">Close / Chiudi</button></dialog><dialog id="work-preview"></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
